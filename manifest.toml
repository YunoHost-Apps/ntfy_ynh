packaging_format = 2

id = "ntfy"
name = "ntfy"
description.en = "Send notifications to a smartphone or computer via scripts"
description.fr = "Service pour envoyer des notifications vers un smartphone ou ordinateur via des scripts"

version = "2.38.3~ynh1"

maintainers = ["Alexander Wühr"]

[upstream]
license = "GPL-2.0-only"
website = "https://ntfy.sh/"
demo = "https://ntfy.sh/app"
admindoc = "https://docs.ntfy.sh/"
userdoc = "https://docs.ntfy.sh/"
code = "https://github.com/binwiederhier/ntfy"
fund = "https://liberapay.com/ntfy"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
	[install.domain]
	type = "domain"

	[install.admin]
	type = "user"

	[install.password]
	type = "password"

[resources]
	[resources.sources]

	[resources.sources.main]
	amd64.url = "https://github.com/binwiederhier/ntfy/releases/download/v2.38.3/ntfy_2.38.3_linux_amd64.tar.gz"
	amd64.sha256 = "b47bbfb7f93f0993aa19fc0412a686f11ea350644fcea598b8c37bcae3ced9e8"

	arm64.url = "https://github.com/binwiederhier/ntfy/releases/download/v2.38.3/ntfy_2.38.3_linux_arm64.tar.gz"
	arm64.sha256 = "43b9e0b7a841210d09cefdc75dd25f5419529cdfe2677c551c2e5b6420e03ed1"

	armhf.url = "https://github.com/binwiederhier/ntfy/releases/download/v2.38.3/ntfy_2.38.3_linux_armv7.tar.gz"
	armhf.sha256 = "3016ae7d2c9173cbc6ee8fc042e2760503c3a1b2b50da781f7ba7420d0ae6fe6"

	autoupdate.strategy = "latest_github_release"
	autoupdate.asset.amd64 = '.*_linux_amd64\.tar\.gz'
	autoupdate.asset.arm64 = '.*_linux_arm64\.tar\.gz'
	autoupdate.asset.armhf = '.*_linux_armv7\.tar\.gz'

	[resources.system_user]

	[resources.install_dir]

	[resources.permissions]
	main.url = "/"
	main.auth_header = false
	main.protected = true
	main.allowed = "visitors"

	[resources.ports]
	main.default = 8080
