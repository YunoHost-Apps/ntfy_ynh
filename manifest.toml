packaging_format = 2

id = "ntfy"
name = "ntfy"
description.en = "Send notifications to a smartphone or computer via scripts"
description.fr = "Service pour envoyer des notifications vers un smartphone ou ordinateur via des scripts"

version = "2.31.0~ynh1"

maintainers = ["Alexander Wühr"]

[upstream]
license = "GPL-2.0-only"
website = "https://ntfy.sh/"
demo = "https://ntfy.sh/app"
admindoc = "https://docs.ntfy.sh/"
userdoc = "https://docs.ntfy.sh/"
code = "https://github.com/binwiederhier/ntfy"
fund = "https://liberapay.com/ntfy"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
	[install.domain]
	type = "domain"

	[install.admin]
	type = "user"

	[install.password]
	type = "password"

[resources]
	[resources.sources]

	[resources.sources.main]
	amd64.url = "https://github.com/binwiederhier/ntfy/releases/download/v2.31.0/ntfy_2.31.0_linux_amd64.tar.gz"
	amd64.sha256 = "8bd80d28608e65bfcbd2ca8248ad40ff040bbed55799d4180f8b33dcac26c3e7"

	arm64.url = "https://github.com/binwiederhier/ntfy/releases/download/v2.31.0/ntfy_2.31.0_linux_arm64.tar.gz"
	arm64.sha256 = "676f3b38ac8e7ed0dad3361a154429595dc5b599927f8c092d5130f772d42bad"

	armhf.url = "https://github.com/binwiederhier/ntfy/releases/download/v2.31.0/ntfy_2.31.0_linux_armv7.tar.gz"
	armhf.sha256 = "0b783ceb7f926d8d6179f0b7079101e6ffe63862e9165bf10d6048b96659215e"

	autoupdate.strategy = "latest_github_release"
	autoupdate.asset.amd64 = '.*_linux_amd64\.tar\.gz'
	autoupdate.asset.arm64 = '.*_linux_arm64\.tar\.gz'
	autoupdate.asset.armhf = '.*_linux_armv7\.tar\.gz'

	[resources.system_user]

	[resources.install_dir]

	[resources.permissions]
	main.url = "/"
	main.auth_header = false
	main.protected = true
	main.allowed = "visitors"

	[resources.ports]
	main.default = 8080
