packaging_format = 2

id = "ntfy"
name = "ntfy"
description.en = "Send notifications to a smartphone or computer via scripts"
description.fr = "Service pour envoyer des notifications vers un smartphone ou ordinateur via des scripts"

version = "2.33.1~ynh1"

maintainers = ["Alexander Wühr"]

[upstream]
license = "GPL-2.0-only"
website = "https://ntfy.sh/"
demo = "https://ntfy.sh/app"
admindoc = "https://docs.ntfy.sh/"
userdoc = "https://docs.ntfy.sh/"
code = "https://github.com/binwiederhier/ntfy"
fund = "https://liberapay.com/ntfy"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
	[install.domain]
	type = "domain"

	[install.admin]
	type = "user"

	[install.password]
	type = "password"

[resources]
	[resources.sources]

	[resources.sources.main]
	amd64.url = "https://github.com/binwiederhier/ntfy/releases/download/v2.33.1/ntfy_2.33.1_linux_amd64.tar.gz"
	amd64.sha256 = "224aa4c8bd1b1d5ede011283c56eddf72893ba787cfcc5988e0c6bf07d84cc3f"

	arm64.url = "https://github.com/binwiederhier/ntfy/releases/download/v2.33.1/ntfy_2.33.1_linux_arm64.tar.gz"
	arm64.sha256 = "e211baed18313b868d6304267d887d9602ee920b0962c36d80f2a346795abca2"

	armhf.url = "https://github.com/binwiederhier/ntfy/releases/download/v2.33.1/ntfy_2.33.1_linux_armv7.tar.gz"
	armhf.sha256 = "8921a32dbb0f24dd58ebba74a17e381b9dec785c10a1169973d5f274829d3b99"

	autoupdate.strategy = "latest_github_release"
	autoupdate.asset.amd64 = '.*_linux_amd64\.tar\.gz'
	autoupdate.asset.arm64 = '.*_linux_arm64\.tar\.gz'
	autoupdate.asset.armhf = '.*_linux_armv7\.tar\.gz'

	[resources.system_user]

	[resources.install_dir]

	[resources.permissions]
	main.url = "/"
	main.auth_header = false
	main.protected = true
	main.allowed = "visitors"

	[resources.ports]
	main.default = 8080
